[package]
name = "wc3-mcp"
version = "0.1.0"
edition = "2024"
description = "An MCP server (stdio) for Warcraft III's files: SLK tables to read, query and edit, from disk or from inside an MPQ archive or a map"
license = "CC0-1.0"

[lib]
name = "wc3_mcp"
path = "src/lib.rs"

[[bin]]
name = "wc3-mcp"
path = "src/main.rs"

[dependencies]
slk-rs = { path = "../slk-rs" }
storm-rs = { path = "../storm-rs" }
w3abdhqtu-rs = { path = "../w3abdhqtu-rs" }
wts-rs = { path = "../wts-rs" }
w3c-rs = { path = "../w3c-rs" }
w3e-rs = { path = "../w3e-rs" }
w3i-rs = { path = "../w3i-rs" }
w3r-rs = { path = "../w3r-rs" }
w3s-rs = { path = "../w3s-rs" }
wpm-rs = { path = "../wpm-rs" }
imp-rs = { path = "../imp-rs" }
mmp-rs = { path = "../mmp-rs" }
wct-rs = { path = "../wct-rs" }
shd-rs = { path = "../shd-rs" }
doo-rs = { path = "../doo-rs" }
wtg-rs = { path = "../wtg-rs" }
w3o-rs = { path = "../w3o-rs" }
txt2-rs = { path = "../txt2-rs" }
parser-rs = { path = "../parser-rs" }
bni-rs = { path = "../bni-rs" }
# Names in the project's JASS: references to triggers and variables.
jass-rs = { path = "../jass-rs" }
# PNG pictures (zlib, CRC); storm-rs uses it already.
flate2 = "1.1.11"
# The editor's project model: game files, metadata, and (planned) the
# workspace, symbol index and rename for JASS.
wc3-server = { path = "../wc3-rs/server" }
wc3-build = { path = "../wc3-build" }
# The World Editor's terrain work, for pictures of a terrain (w3e_image).
wc3-editor = { path = "../wc3-rs/editor" }
# Keys in insertion order: a row's columns stay in the table's order.
serde_json = { version = "1.0.145", features = ["preserve_order"] }
